name: Vigilar iPhone 16 Pro

on:
  schedule:
    - cron: "7,37 * * * *"   # cada 30 min (evita :00 y :30, que van saturados)
  workflow_dispatch:          # botón "Run workflow" para probar a mano

permissions:
  contents: write             # para guardar estado.json

concurrency: vigilar

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Comprobar precios
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python vigilar.py

      - name: Guardar estado
        run: |
          git config user.name "vigilante-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || (git commit -m "estado" && git push)
